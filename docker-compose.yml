services:
  dwh_postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: insurance_dwh
    ports:
      - "5432:5432"
    volumes:
      - insurance_pgdata:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    depends_on:
      - dwh_postgres

volumes:
  insurance_pgdata:
